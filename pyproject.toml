[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airdrop-agent"
version = "4.1.0"
description = "Autonomous airdrop operator: identities, wallets, socials, testnets, quests, radar"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "web3>=7.0,<8",
  "eth-account>=0.13",
  "cryptography>=42",
  "mnemonic>=0.21",
  "base58>=2.1",
  "solders>=0.21",
  "telethon>=1.36",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.64,<1.66"]
solana = ["solders>=0.21"]
discord = ["discord.py-self>=2.0"]
telegram = ["telethon>=1.36"]
full = ["playwright>=1.64,<1.66", "discord.py-self>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
aa = "aa.cli:main"

[tool.setuptools.packages.find]
include = ["aa*"]

[tool.setuptools.package-data]
"aa.browser" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
